<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | Money Vault</title>

<link rel="stylesheet" href="css/auth.css">
</head>

<body>

<div class="container">

<div class="card">

<h2>Create Account</h2>
<p>Open your Money Vault account</p>

<form id="registerForm">

<div class="inputBox">
<input type="text" id="fullName" required>
<span>Full Name</span>
</div>

<div class="inputBox">
<input type="tel" id="phone" required>
<span>Phone Number</span>
</div>

<div class="inputBox">
<input type="email" id="email" required>
<span>Email</span>
</div>

<div class="inputBox">
<input type="password" id="password" required>
<span>Password</span>
</div>

<div class="inputBox">
<input type="password" id="confirmPassword" required>
<span>Confirm Password</span>
</div>

<div class="inputBox">
    <input
        type="text"
        id="referralCode"
        readonly
    >
    <span>Referral Code</span>
    </div>

<button type="submit">Create Account</button>

<div class="links">
<p>Already have an account?
<a href="login.html">Login</a>
</p>
</div>

</form>

</div>

</div>


<script type="module">
import { registerUser } from "./js/auth.js";


// ======================================
// GET REFERRAL CODE FROM URL
// ======================================

const urlParams =
    new URLSearchParams(window.location.search);

const urlReferralCode =
    urlParams.get("ref") || "";


// ======================================
// PUT REFERRAL CODE INTO INPUT
// ======================================

const referralInput =
    document.getElementById("referralCode");

if (urlReferralCode && referralInput) {

    referralInput.value =
        urlReferralCode;

}


// ======================================
// REGISTER
// ======================================

document
.getElementById("registerForm")
.addEventListener("submit", async (e) => {

    e.preventDefault();


    const fullName =
        document
        .getElementById("fullName")
        .value
        .trim();


    const phone =
        document
        .getElementById("phone")
        .value
        .trim();


    const email =
        document
        .getElementById("email")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;


    // ==================================
    // GET REFERRAL CODE
    // ==================================

    const referralCode =
        document
        .getElementById("referralCode")
        .value
        .trim();


    // ==================================
    // PASSWORD CHECK
    // ==================================

    if (password !== confirmPassword) {

        alert("Passwords do not match.");

        return;

    }


    // ==================================
    // REGISTER USER
    // ==================================

    const success =
        await registerUser(
            fullName,
            phone,
            email,
            password,
            referralCode
        );


    // ==================================
    // SUCCESS
    // ==================================

    if (success) {

        alert(
            "Registration Successful! You received 500 RWF bonus."
        );

        window.location.href =
            "login.html";

    }

});
</script>
</body>
</html>
